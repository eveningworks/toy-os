# drivers.conf -- how each driver is BUILT.
#
#     <name> = builtin | module
#
# `builtin` links the driver into kernel.bin; `module` compiles it to
# /lib/modules/<name>.ko, loaded at boot when a device it matches is
# present (modules.alias), by a line in /etc/modules, or by hand with
# `modload`. A driver not listed here is builtin. The name is the
# driver's source file under kernel/drivers/ without its .c, and the
# build refuses a name that matches no file.
#
# Only a SELF-CONTAINED driver can be a module: one .c file whose
# kernel imports are all in kernel/core/kexports.c. The build checks the
# imports (tools/gen_modalias.py) and names the missing export.
#
# Another file: `make iso DRIVERS_CONF=my.conf`.

e1000 = module
r8169 = module

# --- build options ----------------------------------------------------
#
#     option <name> = <value>
#
# How this kernel is BUILT, beside which drivers are in it -- the same
# arrangement as FreeBSD's conf/GENERIC and Linux's .config. An unknown
# name is an error rather than a line quietly ignored, exactly as a
# misspelt driver above is. A command-line variable still wins for one
# build: `make STRIP=0` beats `option strip = yes` here.
#
#   strip         yes/no  split the kernel's debug info into
#                         build/kernel.debug. `no` leaves it in
#                         kernel.bin, which is 6.1 MB instead of 1.7 --
#                         for a debugging session that wants one file.
#   compress      yes/no  gzip the live filesystem image into the ISO.
#                         `no` roughly doubles toy-os-live.iso.
#   cmdline       text    boot words baked into both media. Empty by
#                         default; every word is in docs/boot-flags.md.
#   grub_timeout  number  seconds GRUB shows its menu. 0 boots straight
#                         through, which is what every automated path
#                         wants; `remote.py flash` REFUSES while this is
#                         0, because the rescue entry is unreachable.
#   extras        yes/no  fetch the optional differently-licensed
#                         material. THE ONLY OPTION HERE THAT REACHES
#                         THE NETWORK -- and this file is tracked, so
#                         committing `yes` makes every clone's build
#                         download. The licence prompt still gates it.

# Only the two that differ from the Makefile's own defaults are set
# here; the rest are listed above so you know they exist. `cmdline` and
# `grub_timeout` are deliberately LEFT UNSET -- every automated path (the
# boot smoke test, ktest, gui_regress, CI) wants no baked-in boot words
# and a timeout of 0, and a value committed here would change all of
# them at once.
option strip    = yes
option compress = yes
