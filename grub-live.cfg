# GRUB menu for the LIVE ISO (`make live-iso` -> toy-os-live.iso).
#
# The difference from grub.cfg is the module and the second entry:
# /boot/live.img is a TFS3 filesystem the kernel mounts from RAM, which
# is what lets this image boot a usable system on a machine with no disk
# (docs/live-cd-design.md).
#
#   toy-os (live)         the default here: prefers the image, and is
#                         what you want when booting this ISO at all.
#   toy-os (use a disk)   mounts a toy-os disk if the machine has one,
#                         falling back to the image if it does not --
#                         for booting the live media on a machine that
#                         already has toy-os installed.
#
# A timeout is set on purpose, unlike the ordinary ISO's 0: choosing
# between these two is the whole reason this image has a menu.
set timeout=5
set default=0

menuentry "toy-os (live)" {
    multiboot2 /boot/kernel.bin live
    module2 /boot/live.img live.img
    boot
}

menuentry "toy-os (use a disk if present)" {
    multiboot2 /boot/kernel.bin
    module2 /boot/live.img live.img
    boot
}
