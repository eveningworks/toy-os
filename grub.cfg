# timeout is substituted at ISO build time from the Makefile's
# GRUB_TIMEOUT (default 0 = boot straight through, no menu drawn).
# `make run-menu` builds with a timeout so the menu is visible; every
# other path -- make run, the boot smoke test, ktest, CI -- stays
# instant, because a few seconds per boot adds up across a test cycle.
set timeout=@GRUB_TIMEOUT@
set default=0

# Still no module2 line here, and now for a measured reason rather than
# an inherited one. A live filesystem image IS carried as a module --
# but only by the LIVE ISO (grub-live.cfg, `make live-iso`), because
# GRUB reads the whole module off the emulated CD-ROM before the kernel
# starts: a 129 MiB image took this boot from ~2s to 7s locally and blew
# CI's 12s smoke-test timeout outright.
#
# This is the ordinary ISO: kernel only, boots from the disk, fast.
menuentry "toy-os" {
    multiboot2 /boot/kernel.bin
    boot
}
