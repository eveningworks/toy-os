set timeout=0
set default=0

# No module2 lines anymore -- every ELF64 binary that used to be a GRUB
# module (lspci and, later, every *_test.elf) is now seeded onto
# disk.img's /bin at build time instead (see the Makefile's `seed`
# target, tools/tfs2_writer.py, and docs/decisions.md) and run via the
# shell's `run <name>`, not loaded by GRUB at boot.
menuentry "toy-os" {
    multiboot2 /boot/kernel.bin
    boot
}
