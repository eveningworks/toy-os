# The KCMDLINE placeholder on the multiboot2 line below is
# substituted at ISO build time from the Makefile's
# KCMDLINE (default empty), so extra kernel boot words can be baked
# in without hand-editing this file or pressing `e` in the GRUB menu
# every boot:  make iso KCMDLINE="video=1920x1080 nokaslr"
# See docs/boot-flags.md for every word the kernel looks for.
#
# LOAD A VIDEO DRIVER BEFORE ANYTHING ASKS FOR A MODE. Without this a
# UEFI boot fails with "no suitable video mode found" and then page-faults
# inside the firmware: GRUB's i386-pc core image has VBE built in, so a
# BIOS boot finds an adapter by luck, while the EFI build reaches
# efi_gop only if something insmods it. all_video pulls in whichever of
# vbe/vga/efi_gop/efi_uga this machine actually has.
insmod all_video
set gfxpayload=auto

# ---------------------------------------------------------------------
# KERNEL BOOT WORDS -- add any of these after /boot/kernel.bin. A SHORT
# copy of this list is repeated inside each menuentry below, because
# GRUB's `e` editor shows the entry BODY only and never these
# top-of-file comments. Or bake one in permanently with
#     make iso KCMDLINE="video=1920x1080 nokaslr"
# Matching is by SUBSTRING and an unknown word is simply ignored.
# Full descriptions: docs/boot-flags.md.
#
#   video=<W>x<H>  ask for this screen size (640x480 .. 3840x2160).
#                  Only a MODESETTING driver can act on it -- vmsvga
#                  can, a plain VESA framebuffer cannot, so on an
#                  adapter GRUB already fixed this does nothing.
#                  Falls back down a ladder of standard sizes if the
#                  adapter refuses.
#   nokaslr        run the kernel where it was linked, no relocation.
#                  First thing to try for an address-dependent bug.
#   nopat          use an MTRR, not PAT, for framebuffer write-combining.
#   notsc          keep the 100 Hz PIT as the clocksource, not the TSC.
#   nousb          skip xHCI bring-up entirely. A RESCUE flag:
#                  bring-up hangs at least one real laptop.
#   usbtrace       print a line per xHCI bring-up step, to find
#                  WHERE it hangs. Off by default.
#   live           mount the GRUB-module filesystem even with a disk
#                  present (live ISO only).
# ---------------------------------------------------------------------
# timeout is substituted at ISO build time from the Makefile's
# GRUB_TIMEOUT (default 0 = boot straight through, no menu drawn).
# `make run MENU=1` builds with a timeout so the menu is visible; every
# other path -- make run, the boot smoke test, ktest, CI -- stays
# instant, because a few seconds per boot adds up across a test cycle.
set timeout=@GRUB_TIMEOUT@
set default=0

# A ONE-SHOT ENTRY, grub-reboot's mechanism: `reboot --entry` (and the
# Start menu's Restart flyout) writes next_entry into grubenv, and it is
# cleared HERE, before anything boots -- so an entry that hangs is taken
# once and the next reset falls back to the default. load_env/save_env
# are the core image's `loadenv` (tools/install_grub.py); a machine whose
# core lacks it has no grubenv either, and skips all of this.
if [ -s $prefix/grubenv ]; then
    load_env
fi
if [ "${next_entry}" ]; then
    set default="${next_entry}"
    set next_entry=
    save_env next_entry
fi

# Still no module2 line here, and now for a measured reason rather than
# an inherited one. A live filesystem image IS carried as a module --
# but only by the LIVE ISO (grub-live.cfg, `make live-iso`), because
# GRUB reads the whole module off the emulated CD-ROM before the kernel
# starts: a 129 MiB image took this boot from ~2s to 7s locally and blew
# CI's 12s smoke-test timeout outright.
#
# THIS FILE SERVES BOTH ORDINARY MEDIA, and that is deliberate. It is
# generated into iso/boot/grub/grub.cfg for the ISO and into
# /boot/grub/grub.cfg inside disk.img's FAT32 boot partition
# (tools/install_grub.py) -- same paths inside both, so one config
# cannot drift from the other. An ordinary boot reads the DISK's copy;
# the ISO is what the live and release images are.
menuentry "toy-os" {
    # Boot words (add after kernel.bin). Full list: docs/boot-flags.md
    #   video=1920x1080  screen size, if the driver can set modes
    #   nokaslr  no relocation   nopat  MTRR not PAT
    #   notsc    PIT clocksource   nousb  skip USB (rescue)
    #   usbtrace  trace xHCI bring-up
    #   target=text|graphical  what init starts this boot
    #
    # bootpart= is the partition GRUB loaded this from, and the kernel
    # roots on the disk carrying it -- so a second disk cannot take the
    # root by sitting on a faster controller. On the CD, which has no
    # partition, GRUB answers `none`; a GRUB without `probe` leaves it
    # empty. Either way the kernel chooses by what each disk holds.
    set bootpart=
    if probe --part-uuid --set=bootpart $root; then true; fi
    multiboot2 /boot/kernel.bin bootpart=$bootpart @KCMDLINE@
    boot
}

# THE RESCUE ENTRY, and it is only reachable with a TIMEOUT. An
# installed machine keeps the kernel it was running as /boot/kernel.old
# (tools/install_grub.py), so a bad flash is one menu pick away from a
# machine that boots -- but the default timeout is 0, which draws no
# menu at all. Build the medium with GRUB_TIMEOUT=5 (or MENU=1) on any
# machine you cannot easily reach with a USB stick.
#
# It is listed second and `default` stays 0, so an automated boot is
# unaffected whether or not kernel.old exists.
menuentry "toy-os (previous kernel)" {
    set bootpart=
    if probe --part-uuid --set=bootpart $root; then true; fi
    multiboot2 /boot/kernel.old bootpart=$bootpart @KCMDLINE@
    boot
}
