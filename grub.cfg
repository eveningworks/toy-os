# timeout is substituted at ISO build time from the Makefile's
# GRUB_TIMEOUT (default 0 = boot straight through, no menu drawn).
# `make run-menu` builds with a timeout so the menu is visible; every
# other path -- make run, the boot smoke test, ktest, CI -- stays
# instant, because a few seconds per boot adds up across a test cycle.
set timeout=@GRUB_TIMEOUT@
set default=0

# The module2 line is BACK, and for a different reason than the one that
# retired it. It used to carry individual ELF binaries, which the disk
# image seeds far better (see docs/decisions.md). It now carries a
# FILESYSTEM IMAGE: /boot/live.img is a small TFS3 volume the kernel can
# mount from RAM, which is what lets this ISO boot a usable system with
# no disk attached (docs/live-cd-design.md).
#
# The module is loaded on BOTH entries, because loading it costs only
# memory and the kernel decides what to do with it:
#
#   toy-os          mounts the DISK if there is one, exactly as before,
#                   and falls back to the live image when there is not.
#   toy-os (live)   passes `live` on the command line, which makes the
#                   kernel prefer the image even with a disk present.
#
# So a disk is never displaced by accident, and a machine with no disk
# still boots to something usable instead of an empty RAM filesystem.
menuentry "toy-os" {
    multiboot2 /boot/kernel.bin
    module2 /boot/live.img live.img
    boot
}

menuentry "toy-os (live -- ignore any disk)" {
    multiboot2 /boot/kernel.bin live
    module2 /boot/live.img live.img
    boot
}
