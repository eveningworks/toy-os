# GRUB menu for the DEMO ISO (`make demo-iso` -> toy-os-demo.iso).
#
# Identical to the live ISO's, plus `demo` on the kernel command line,
# which makes the kernel read /usr/wm/demo.script and perform it (see
# apps/demo.h). No timeout and no choice: this image exists to be booted
# and watched, so anything that waits for a keypress defeats it.
set timeout=0
set default=0

menuentry "toy-os (demo)" {
    multiboot2 /boot/kernel.bin live demo
    module2 /boot/live.img live.img
    boot
}
