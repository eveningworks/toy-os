# How network interfaces are named, and who gets an address.
# Read by /bin/netd. Nothing here is required -- delete the file and
# every card keeps the name the kernel gave it.
#
# A NAME IS AN IDENTITY AND FOLLOWS THE CARD. The kernel names a card
# from the last three bytes of its MAC (net-718ebf), which are the part
# a vendor assigns per device, so moving an adapter to another socket
# renames nothing. Where it currently sits is a separate thing and
# `ifconfig` prints it: `at pci3.0`, `at usb13`.

# --- the rule for a card this file does not name ----------------------
#
# scheme  how to build a name
#   mac       net-718ebf   the card's own serial   (follows the card)
#   location  net-pci3.0   where it is plugged in  (follows the socket)
#   driver    net-r8169    what drives it
#   kernel    leave the kernel's name alone
#
# prefix  what a built name starts with; `eth` gives eth-718ebf.
#
# A card whose scheme cannot be answered -- `location` on a driver that
# reports none -- keeps the kernel's name rather than getting a worse
# one.
scheme = mac
prefix = net

# --- names for particular cards ---------------------------------------
#
# Most specific wins: a MAC, then a location, then a driver. So one
# adapter can be named by its MAC while every card in a slot, or every
# card a driver claims, is named by the lines below it.
#
#   54:ee:75:71:8e:bf = lan      this exact card, wherever it is plugged
#   pci3.0            = builtin  whatever card is in that slot
#   r8153             = usb      any card this driver claims
#
# A name may not contain a space, an `=` or a `/`: it reaches a lease
# filename (/var/dhcp-<name>.lease) and a socket's device binding.

# --- addresses --------------------------------------------------------
#
# dhcp  which cards netd leases an address for.
#   all   every card that has none                          (the default)
#   none  no card; addresses come from `ifconfig` by hand
dhcp = all
