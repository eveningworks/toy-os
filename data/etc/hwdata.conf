# Where `hwdata update` fetches the id databases from.
# Read by /bin/hwdata, which /bin/lspci --update and /bin/lsusb --update
# hand off to. Nothing here is required -- delete the file and the
# built-in upstream URLs below are used unchanged.
#
# THESE EXIST SO THE FETCH CAN BE POINTED SOMEWHERE ELSE. A machine with
# no route to the internet can be given a copy on the LAN, and a test can
# be given one on the host, which is how this is checked without any
# traffic leaving the machine.
#
# A REFRESH IS NOT AUTOMATIC AND NEVER WILL BE. Nothing here runs on a
# timer: the databases are a convenience, and a system that phones home
# on its own for one is a system doing something its owner did not ask
# for. `hwdata update` is a command a person types.

# The PCI id database -- https, so on a build with no CA certificates
# this needs a mirror here or an explicit `-k`. `make iso EXTRAS=1`
# installs Mozilla's roots and it then verifies normally.
pci_url = https://pci-ids.ucw.cz/v2.2/pci.ids

# The USB one. linux-usb.org offers no https at all, so this is plain
# http and the download is neither encrypted nor authenticated -- which
# matters less than it sounds for a file of names, and matters at all
# only because the alternative is silence about it.
usb_url = http://www.linux-usb.org/usb.ids
