# The remote desktop server -- read by /bin/remoted every few seconds,
# written by System Settings > Network > Remote Desktop. `remoted status`
# prints what it makes of this file.
#
# NOTHING IS ON UNTIL YOU SAY SO, and a protocol with no password refuses
# every viewer.

# --- who may connect, for every protocol --------------------------------
#
# when   after the password is accepted:
#   ask                 ask at the screen every time -- the trusted
#                       list is not consulted
#   ask-unless-trusted  let a trusted address in, ask about the rest
#   always              let anyone with the password in
when = ask-unless-trusted
#
# from   network   only addresses on a network a card here is on
#        anywhere  any address (a trusted one is always allowed)
from = network
#
# trusted   addresses or subnets let in without asking, separated by
#           spaces: trusted = 192.168.1.20 192.168.1.0/24
#           A name for one goes under [labels], keyed by the address as
#           written: [labels] then 192.168.1.20 = my laptop. "Always
#           allow" on the card at the screen adds to this list.
#           VNC tells a server nothing else about who is connecting, so
#           an address is all a trust decision can rest on -- the
#           password is still required.
#
# view_only = yes   the viewer sees the screen; its keys and mouse are ignored

# --- VNC (RFB 3.8): TigerVNC, RealVNC, Remmina, macOS Screen Sharing -----
#
# VNC's password check uses only the first 8 characters, and the session
# is NOT encrypted: use it on a network you trust.
[vnc]
enabled = no
port = 5900
password =
