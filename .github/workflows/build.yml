name: build

# THIS NO LONGER RUNS ON EVERY PUSH, and that is deliberate.
#
# What CI is uniquely good for here is a CLEAN-CHECKOUT build on a
# machine that is not the developer's -- it catches "works because of an
# untracked file, a stale object, or something only installed locally",
# which nothing run on the dev machine can. It found a real driver bug
# on 2026-08-19 for exactly that reason: the runner has QEMU 8.2.2
# against 11.1 locally, and the host decides which clocksource the
# kernel picks.
#
# What it was BAD at was being a per-push gate. Runs cost ~90 s at best,
# and two in one afternoon went red for reasons that had nothing to do
# with this repo -- one with `apt-get install` timing out after 8
# minutes. A gate that cries wolf gets ignored, and then it is worse
# than no gate.
#
# So the second QEMU moved local and fast (tools/qemu_matrix.py, which
# runs the suite against 6.2/7.2/8.2 in Docker), and what stays here is
# the part that genuinely needs somebody else's machine:
#
#   - a RELEASE TAG is verified from a clean clone before ISOs ship
#   - `gh workflow run build.yml` runs the whole pipeline on demand
#
# Ordinary pushes are covered by tools/preflight.sh locally.
#
# Deliberately narrow in scope regardless: build + boot smoke test +
# the kernel/userland suites, not the QMP GUI-testing dance
# (tools/qmp_test.py), which needs a display head and is for
# interactive verification of a specific GUI change.

on:
  # A release tag: the one moment correctness really matters, and the
  # one build nobody should cut from a dirty working tree.
  push:
    tags: ['v*']
  # On demand -- and note this exists, because six pushes were spent
  # iterating on a CI failure before somebody noticed it was here.
  workflow_dispatch: {}

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # A HUNG STEP MUST FAIL, NOT SIT THERE. GitHub's default job timeout
    # is SIX HOURS, so when apt-get wedged on 2026-08-19 three runs sat
    # "in progress" for one, two and three hours -- long enough that the
    # commit list showed no verdict at all for the whole afternoon, which
    # is worse than a red X: a pending run looks like a test still
    # thinking rather than infrastructure that has died. A full run is
    # 1-7 minutes, so 20 is generous.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same package list installed by hand earlier in this project's
      # history (see the build-304-era commits) -- nasm for
      # the boot/interrupt/context-switch assembly, grub-pc-bin +
      # grub-common + xorriso for `make iso` (grub-mkrescue), and
      # qemu-system-x86 for both `make run` and this workflow's own
      # smoke test.
      - name: Install build + QEMU dependencies
        # Its own tighter timeout, because this step is the one that
        # hung: it depends on a mirror this repo does not control, and a
        # network stall here should be distinguishable from a slow test.
        timeout-minutes: 8
        run: |
          # Retries rather than one attempt: apt against a flaky mirror
          # is the single most common transient failure in CI here.
          sudo apt-get update -qq -o Acquire::Retries=3
          # libxkbcommon-tools provides xkbcli, which the Makefile's `seed`
          # target uses to generate /etc/kbs/<layout> from XKB's own data.
          # Without it that step SKIPS SILENTLY, so CI was building images
          # with no keyboard layouts at all -- which nothing noticed until
          # check_layout.py started comparing the image against its doc.
          # libx11-data carries X11's Compose table, which gen_kbs.py reads
          # for dead-key pairs; without it the pairs come from unicodedata
          # and a few (circumflex + digit -> superscript) go missing.
          sudo apt-get install -y -qq -o Acquire::Retries=3 nasm grub-pc-bin grub-common xorriso qemu-system-x86 mtools libxkbcommon-tools libx11-data

      - name: make clean && make all
        run: make clean && make all

      - name: make iso
        run: make iso

      # CI always builds clean, so it can never OBSERVE a stale object --
      # which is precisely why the Makefile's `-include` line for the
      # -MMD/-MP dependency files could break in a directory move and
      # stay broken. This checks the property structurally instead of
      # waiting for a symptom: touch a header per build directory, ask
      # make what it would rebuild, and require an answer.
      - name: Header dependency tracking works
        run: python3 tools/check_deps.py -v

      # Structural, not behavioural: does the seeded image's directory
      # layout still match docs/filesystem-layout.md? Cheap (no boot),
      # and it catches a directory added without being documented --
      # the kind of drift that is invisible until someone relies on the
      # doc being true.
      - name: Filesystem layout matches its doc
        run: python3 tools/check_layout.py

      - name: Documentation checks (dead pointers, duplicated entries)
        run: python3 tools/check_docs.py
      - name: Dispatch-chain check (a chain big enough to want a table)
        run: python3 tools/check_dispatch.py

      - name: Boot smoke test (headless, no GUI)
        run: python3 tools/boot_smoke_test.py -v

      # The in-kernel test suite (kernel/include/kernel/ktest.h). The
      # smoke test above answers "does it still boot"; this answers "does
      # it still work" -- and unlike the pre-2026-08-13 boot-time
      # self-tests it actually fails the build when something is wrong,
      # instead of printing FAILED into a log nobody reads.
      # The in-kernel test suite, on the DEFAULT (ATA) configuration.
      #
      # An attempt to run this with the filesystem on virtio-blk was
      # reverted: virtio-blk never came up on the runner at all (zero
      # "block: virtio-blk active" lines, and the suite reported the
      # skip count of an ATA boot), so it changed nothing while adding
      # a second image and a second job. Diagnosing why belongs with
      # the driver, not in CI. See docs/bugs.md.
      #
      # `sync` above stays: `make iso` hands grub-mkrescue a ~750 MB
      # image and the guest boots while those pages are still being
      # written back, which is the documented cause of this job's
      # recurring `dma write failed (drive stayed busy)`.
      - name: Kernel test suite (ktest)
        run: python3 tools/ktest_run.py -v

      # ...and again with the filesystem on VIRTIO-BLK.
      #
      # Both, because they are different code paths and each has caught
      # something the other could not. This one started as a
      # `continue-on-error` diagnostic to settle whether virtio-blk
      # even works on a runner (it does); it found a real driver bug
      # instead -- virtqueue_poll() timing out on a ~12 ms budget and
      # then letting late completions desync the used ring -- which
      # reproduced NOWHERE locally, because the runner has QEMU 8.2.2
      # against 11.1 here and picks a different clocksource.
      #
      # That is the argument for keeping it blocking now: this
      # configuration is the only place that class of bug has ever been
      # visible.
      #
      # A separate image because QEMU write-locks one and the same file
      # cannot be attached twice; the IDE drive stays attached so the
      # [ata]/[atac] suites keep a real drive rather than skipping.
      - name: Kernel test suite (ktest, filesystem on virtio-blk)
        run: |
          cp --reflink=auto --sparse=always disk.img ci-virtio.img
          python3 tools/ktest_run.py -v --virtio-disk ci-virtio.img

      # And on SATA: an AHCI-only defect had no coverage at all. The copy
      # shares disk.img's PARTUUIDs, so AHCI's precedence makes it the
      # root, and ktest_run.py fails the step if it did not.
      - name: Kernel test suite (ktest, filesystem on AHCI)
        run: |
          cp --reflink=auto --sparse=always disk.img ci-ahci.img
          python3 tools/ktest_run.py -v --ahci-disk ci-ahci.img

      # The same question one privilege ring out. ktest runs INSIDE the
      # kernel, so it cannot tell whether a /tests binary still links,
      # loads and passes its own checks -- which is exactly the gap
      # libc_test covers. See the tool's docstring for what it
      # deliberately does not run, and why running everything would be
      # worse than running these six.
      - name: Ring-3 userland tests (/tests diagnostics)
        run: python3 tools/usertest_run.py
