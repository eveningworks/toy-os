name: build

# Catches a build break (or a boot regression) automatically on every
# push/PR, independent of whether a Claude session or a human remembered
# to verify locally first -- see CLAUDE.md's "Working in the cloud
# sandbox" section for why local verification has historically been a
# manual, session-by-session thing up to this point. This is deliberately
# narrow in scope: build + boot smoke test, not the full QMP GUI-testing
# dance (tools/qmp_test.py) -- that needs a real display head / VNC and
# is meant for interactive-ish verification of a specific GUI change, not
# a fast per-push gate. See tools/boot_smoke_test.py's own docstring for
# that division.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same package list installed by hand earlier in this project's
      # history (see CHANGELOG.md's build-304-era session) -- nasm for
      # the boot/interrupt/context-switch assembly, grub-pc-bin +
      # grub-common + xorriso for `make iso` (grub-mkrescue), and
      # qemu-system-x86 for both `make run` and this workflow's own
      # smoke test.
      - name: Install build + QEMU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm grub-pc-bin grub-common xorriso qemu-system-x86 mtools

      - name: make clean && make all
        run: make clean && make all

      - name: make iso
        run: make iso

      # Structural, not behavioural: does the seeded image's directory
      # layout still match docs/filesystem-layout.md? Cheap (no boot),
      # and it catches a directory added without being documented --
      # the kind of drift that is invisible until someone relies on the
      # doc being true.
      - name: Filesystem layout matches its doc
        run: python3 tools/check_layout.py

      - name: Boot smoke test (headless, no GUI)
        run: python3 tools/boot_smoke_test.py -v

      # The in-kernel test suite (kernel/include/kernel/ktest.h). The
      # smoke test above answers "does it still boot"; this answers "does
      # it still work" -- and unlike the pre-2026-08-13 boot-time
      # self-tests it actually fails the build when something is wrong,
      # instead of printing FAILED into a log nobody reads.
      - name: Kernel test suite (ktest)
        run: python3 tools/ktest_run.py -v
